name: Release

# Пакет внешней компоненты для 1С собирается из бинарников обеих платформ:
# один ZIP с MANIFEST.XML, где перечислены и Linux, и Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    name: Версия тега = версия проекта
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Сверить тег с project(VERSION)
        id: check
        run: |
          cmake_version=$(grep -m1 -E '^\s*VERSION [0-9]' CMakeLists.txt | tr -d ' ' | sed 's/VERSION//')
          echo "version=$cmake_version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Ручной запуск, версия из CMakeLists: $cmake_version"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с project VERSION $cmake_version" >&2
            exit 1
          fi

  build-linux:
    # Отдельная сборка под каждое семейство систем вместо одного универсального
    # бинарника. Причина: версии системных библиотек несовместимы между собой —
    # libevent so.6 против so.7, OpenSSL 1.1 против 3, — и собранное на свежей
    # Ubuntu не запускается на Astra Linux. Так каждая сборка линкуется ровно
    # с тем, что стоит у клиента, без статических копий чужих библиотек.
    name: Linux ${{ matrix.target }}
    needs: version-check
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      # Одна упавшая цель не должна отменять остальные: сборки независимы.
      fail-fast: false
      matrix:
        include:
          # glibc 2.28, libevent so.6, OpenSSL 1.1 — Astra Linux 1.7,
          # РЕД ОС 7-8, RHEL/CentOS 8, Ubuntu 20.04
          - target: astra17
            image: rockylinux:8
            glibc_max: "2.28"
            install: dnf install -y gcc-c++ cmake make git libevent-devel openssl-devel libuuid-devel python3 binutils zip
          # glibc 2.35, OpenSSL 3 — Ubuntu 22.04, Debian 12, RHEL 9
          - target: ubuntu2204
            image: ubuntu:22.04
            glibc_max: "2.35"
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config git libevent-dev libssl-dev uuid-dev python3 binutils zip
          # glibc 2.39, OpenSSL 3 — Ubuntu 24.04 и новее
          - target: ubuntu2404
            image: ubuntu:24.04
            glibc_max: "2.39"
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config git libevent-dev libssl-dev uuid-dev python3 binutils zip
    steps:
      # Зависимости ставим до checkout: в голом образе нет ни git, ни компилятора.
      - name: Install system dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build -- -j$(nproc)

      # Бинарник, требующий glibc выше целевой, молча не загрузится у клиента.
      # Проверяем здесь, а не узнаём об этом при внедрении.
      - name: Проверить совместимость
        run: |
          required=$(objdump -T build/libBlackRabbitMQ.so \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "Требует не выше: $required (цель — GLIBC_${{ matrix.glibc_max }})"
          highest=$(printf '%s\nGLIBC_%s\n' "$required" "${{ matrix.glibc_max }}" | sort -uV | tail -1)
          if [ "$highest" != "GLIBC_${{ matrix.glibc_max }}" ]; then
            echo "Требуется $required — выше цели ${{ matrix.glibc_max }}" >&2
            exit 1
          fi
          echo "Зависимости: $(objdump -p build/libBlackRabbitMQ.so \
            | grep NEEDED | awk '{print $2}' | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: build/libBlackRabbitMQ.so
          if-no-files-found: error

  build-windows:
    # Платформа 1С чаще ставится 32-битной, и x64-компоненту такой процесс
    # не загрузит в принципе — поэтому в релиз идут обе разрядности.
    name: Windows ${{ matrix.addin_arch }}
    needs: version-check
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - platform: x64
            triplet: x64-windows-static
            addin_arch: x86_64
          - platform: Win32
            triplet: x86-windows-static
            addin_arch: i386
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install poco[netssl]:${{ matrix.triplet }}
          vcpkg install openssl:${{ matrix.triplet }}
          vcpkg install nlohmann-json:${{ matrix.triplet }}

      - name: Build (Release)
        run: |
          cmake -B build -A ${{ matrix.platform }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Проверить экспорт точек входа
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter BlackRabbitMQ.dll | Select-Object -First 1
          if (-not $dll) { throw "BlackRabbitMQ.dll не собралась" }
          $dumpbin = Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            $exports = & $dumpbin.FullName /EXPORTS $dll.FullName | Out-String
            foreach ($name in @("GetClassObject", "DestroyObject", "GetClassNames")) {
              if ($exports -notmatch $name) { throw "DLL не экспортирует $name — 1С её не загрузит" }
            }
            Write-Host "Точки входа на месте"
          } else {
            Write-Host "dumpbin не найден, проверка пропущена"
          }
          Copy-Item $dll.FullName -Destination BlackRabbitMQ.dll

      - name: Проверить разрядность
        shell: pwsh
        run: |
          $fs = [System.IO.File]::OpenRead("BlackRabbitMQ.dll")
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C; $pe = $br.ReadInt32(); $fs.Position = $pe + 4
          $machine = $br.ReadUInt16(); $br.Close()
          $expected = if ("${{ matrix.addin_arch }}" -eq "i386") { 0x14c } else { 0x8664 }
          if ($machine -ne $expected) {
            throw "DLL собрана под 0x{0:X}, ожидалась ${{ matrix.addin_arch }}" -f $machine
          }
          Write-Host "Разрядность соответствует ${{ matrix.addin_arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.addin_arch }}
          path: BlackRabbitMQ.dll
          if-no-files-found: error

  package:
    name: Пакет для 1С и релиз
    needs: [version-check, build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # MANIFEST.XML допускает только один бинарник на пару «ОС + архитектура»,
      # поэтому Linux-сборки нельзя сложить в один архив: каждая цель — свой
      # пакет. Windows-бинарники кладём в каждый, чтобы клиент качал один файл.
      - name: Собрать пакеты для 1С
        run: |
          version="${{ needs.version-check.outputs.version }}"
          for dir in artifacts/linux-*; do
            target="${dir#artifacts/linux-}"
            output="dist/BlackRabbitMQ-${version}-${target}.zip"
            python3 packaging/make_package.py \
              --version "$version" \
              --output "$output" \
              --component Linux:x86_64:"$dir/libBlackRabbitMQ.so" \
              --component Windows:x86_64:artifacts/windows-x86_64/BlackRabbitMQ.dll \
              --component Windows:i386:artifacts/windows-i386/BlackRabbitMQ.dll
          done
          # Пакет без Linux — для тех, у кого только Windows.
          python3 packaging/make_package.py \
            --version "$version" \
            --output "dist/BlackRabbitMQ-${version}-windows.zip" \
            --component Windows:x86_64:artifacts/windows-x86_64/BlackRabbitMQ.dll \
            --component Windows:i386:artifacts/windows-i386/BlackRabbitMQ.dll
          ls -1 dist/

      # Пакет без нужного бинарника платформа подключит, а работать он не будет
      # именно у того клиента, чью разрядность забыли. Проверяем состав явно.
      - name: Проверить состав пакетов
        run: |
          for zip in dist/*.zip; do
            entries="MANIFEST.XML BlackRabbitMQ-x86_64.dll BlackRabbitMQ-i386.dll"
            case "$zip" in *-windows.zip) ;; *) entries="$entries libBlackRabbitMQ.so" ;; esac
            for entry in $entries; do
              unzip -l "$zip" | grep -q "$entry" || { echo "В $zip нет $entry" >&2; exit 1; }
            done
            echo "$zip — состав в порядке"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: addin-1c
          path: dist/*.zip
          if-no-files-found: error

      - name: Приложить к релизу
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Внешняя Native API компонента для работы с RabbitMQ из 1С:Предприятие 8.3.

          **Какой пакет скачать.** Linux-сборки различаются версиями системных
          библиотек, поэтому пакет выбирается по серверу 1С. Windows-бинарники
          (x86_64 и i386) входят в каждый пакет — их выбирать не нужно.

          | Пакет | Для каких систем |
          |---|---|
          | `...-astra17.zip` | Astra Linux 1.7, РЕД ОС 7-8, RHEL/CentOS 8, Ubuntu 20.04 |
          | `...-ubuntu2204.zip` | Ubuntu 22.04, Debian 12, RHEL 9 |
          | `...-ubuntu2404.zip` | Ubuntu 24.04 и новее |
          | `...-windows.zip` | только Windows |

          Не уверены — берите `astra17`: у него самые низкие требования
          (glibc 2.28, OpenSSL 1.1). Проверить свою систему: `ldd --version`.

          Windows-сборки статически линкуют CRT и работают от Windows 7 /
          Server 2008 R2 до Server 2022.

          **Установка.** Добавьте ZIP в конфигурацию как общий макет с видом
          «Двоичные данные», затем:

          ```1c
          ПодключитьВнешнююКомпоненту("ОбщийМакет.BlackRabbitMQ", "BRMQ", ТипВнешнейКомпоненты.Native);
          Клиент = Новый("AddIn.BRMQ.BlackRabbitMQ");
          ```

          Компоненту можно поставить и расширением конфигурации — тогда типовая
          конфигурация не изменяется и остаётся на поддержке.

          **Лицензия.** Некоммерческое использование — PolyForm Noncommercial 1.0.0.
          Любое коммерческое использование — по платной лицензии: jsxlabor@gmail.com
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "BlackRabbitMQ $VERSION" \
            --notes-file notes.md \
            dist/*.zip \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
