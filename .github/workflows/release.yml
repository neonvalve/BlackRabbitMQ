name: Release

# Пакет внешней компоненты для 1С собирается из бинарников обеих платформ:
# один ZIP с MANIFEST.XML, где перечислены и Linux, и Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    name: Версия тега = версия проекта
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Сверить тег с project(VERSION)
        id: check
        run: |
          cmake_version=$(grep -m1 -E '^\s*VERSION [0-9]' CMakeLists.txt | tr -d ' ' | sed 's/VERSION//')
          echo "version=$cmake_version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Ручной запуск, версия из CMakeLists: $cmake_version"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с project VERSION $cmake_version" >&2
            exit 1
          fi

  build-linux:
    name: Linux x86_64 (glibc 2.28)
    needs: version-check
    runs-on: ubuntu-24.04
    # Rocky Linux 8 — это glibc 2.28, libevent-2.1.so.6 и OpenSSL 1.1, то есть
    # ровно то, что стоит в Astra Linux 1.7 и РЕД ОС 7-8, где чаще всего и
    # работает сервер 1С под Linux. Сборка на ubuntu-24.04 требует glibc 2.39,
    # на debian:11 — 2.29 (проверено: тоже мимо Astra с её 2.28).
    container: rockylinux:8
    steps:
      # Зависимости ставим до checkout: в голом образе нет ни git, ни компилятора.
      - name: Install system dependencies
        run: |
          dnf install -y gcc-c++ cmake make git libevent-devel openssl-devel \
            libuuid-devel python3 binutils zip

      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build -- -j$(nproc)

      # Проверка, ради которой всё и затевалось: требование выше 2.28 означает,
      # что на Astra Linux библиотека не загрузится, а узнать об этом от клиента
      # в момент внедрения — худший вариант.
      - name: Проверить требования glibc
        run: |
          required=$(objdump -T build/libBlackRabbitMQ.so \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "Максимальная требуемая версия: $required"
          highest=$(printf '%s\nGLIBC_2.28\n' "$required" | sort -uV | tail -1)
          if [ "$highest" != "GLIBC_2.28" ]; then
            echo "Требуется $required — выше 2.28, на Astra Linux 1.7 не запустится" >&2
            exit 1
          fi
          echo "Зависимости: $(objdump -p build/libBlackRabbitMQ.so \
            | grep NEEDED | awk '{print $2}' | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/libBlackRabbitMQ.so
          if-no-files-found: error

  build-windows:
    # Платформа 1С чаще ставится 32-битной, и x64-компоненту такой процесс
    # не загрузит в принципе — поэтому в релиз идут обе разрядности.
    name: Windows ${{ matrix.addin_arch }}
    needs: version-check
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - platform: x64
            triplet: x64-windows-static
            addin_arch: x86_64
          - platform: Win32
            triplet: x86-windows-static
            addin_arch: i386
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install poco[netssl]:${{ matrix.triplet }}
          vcpkg install openssl:${{ matrix.triplet }}
          vcpkg install nlohmann-json:${{ matrix.triplet }}

      - name: Build (Release)
        run: |
          cmake -B build -A ${{ matrix.platform }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Проверить экспорт точек входа
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter BlackRabbitMQ.dll | Select-Object -First 1
          if (-not $dll) { throw "BlackRabbitMQ.dll не собралась" }
          $dumpbin = Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            $exports = & $dumpbin.FullName /EXPORTS $dll.FullName | Out-String
            foreach ($name in @("GetClassObject", "DestroyObject", "GetClassNames")) {
              if ($exports -notmatch $name) { throw "DLL не экспортирует $name — 1С её не загрузит" }
            }
            Write-Host "Точки входа на месте"
          } else {
            Write-Host "dumpbin не найден, проверка пропущена"
          }
          Copy-Item $dll.FullName -Destination BlackRabbitMQ.dll

      - name: Проверить разрядность
        shell: pwsh
        run: |
          $fs = [System.IO.File]::OpenRead("BlackRabbitMQ.dll")
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C; $pe = $br.ReadInt32(); $fs.Position = $pe + 4
          $machine = $br.ReadUInt16(); $br.Close()
          $expected = if ("${{ matrix.addin_arch }}" -eq "i386") { 0x14c } else { 0x8664 }
          if ($machine -ne $expected) {
            throw "DLL собрана под 0x{0:X}, ожидалась ${{ matrix.addin_arch }}" -f $machine
          }
          Write-Host "Разрядность соответствует ${{ matrix.addin_arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.addin_arch }}
          path: BlackRabbitMQ.dll
          if-no-files-found: error

  package:
    name: Пакет для 1С и релиз
    needs: [version-check, build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: windows-i386
          path: artifacts/windows-i386

      - name: Собрать ZIP компоненты
        run: |
          python3 packaging/make_package.py \
            --version "${{ needs.version-check.outputs.version }}" \
            --output "dist/BlackRabbitMQ-${{ needs.version-check.outputs.version }}.zip" \
            --component Linux:x86_64:artifacts/linux/libBlackRabbitMQ.so \
            --component Windows:x86_64:artifacts/windows-x86_64/BlackRabbitMQ.dll \
            --component Windows:i386:artifacts/windows-i386/BlackRabbitMQ.dll
          unzip -l "dist/BlackRabbitMQ-${{ needs.version-check.outputs.version }}.zip"

      # Пакет без нужного бинарника платформа подключит, а работать он не будет
      # именно у того клиента, чью разрядность забыли. Проверяем состав явно.
      - name: Проверить состав пакета
        run: |
          zip="dist/BlackRabbitMQ-${{ needs.version-check.outputs.version }}.zip"
          for entry in MANIFEST.XML libBlackRabbitMQ.so BlackRabbitMQ-x86_64.dll BlackRabbitMQ-i386.dll; do
            unzip -l "$zip" | grep -q "$entry" || { echo "В пакете нет $entry" >&2; exit 1; }
          done
          echo "Все бинарники на месте"

      - uses: actions/upload-artifact@v4
        with:
          name: addin-1c
          path: dist/*.zip
          if-no-files-found: error

      - name: Приложить к релизу
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Внешняя Native API компонента для работы с RabbitMQ из 1С:Предприятие 8.3.

          **В пакете** (один ZIP, внутри `MANIFEST.XML`):

          | Платформа | Файл |
          |---|---|
          | Windows x86_64 | `BlackRabbitMQ-x86_64.dll` |
          | Windows i386 | `BlackRabbitMQ-i386.dll` |
          | Linux x86_64 | `libBlackRabbitMQ.so` |

          Windows-сборки статически линкуют CRT и рассчитаны на Windows 7 /
          Server 2008 R2 и новее. Linux-сборка собрана на Ubuntu 24.04.

          **Установка.** Добавьте ZIP в конфигурацию как общий макет с видом
          «Двоичные данные», затем:

          ```1c
          ПодключитьВнешнююКомпоненту("ОбщийМакет.BlackRabbitMQ", "BRMQ", ТипВнешнейКомпоненты.Native);
          Клиент = Новый("AddIn.BRMQ.BlackRabbitMQ");
          ```

          **Лицензия.** Некоммерческое использование — PolyForm Noncommercial 1.0.0.
          Любое коммерческое использование — по платной лицензии: jsxlabor@gmail.com
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "BlackRabbitMQ $VERSION" \
            --notes-file notes.md \
            dist/*.zip \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
